<!doctype html>
<html class="dark" lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f131c" />
    <title>CEGA Voxis · Interprète de salle</title>
    <!--
      Installation facultative sur l'écran d'accueil (D18). Un apprenant qui scanne le QR
      code écoute sans rien installer ; la PWA ne fait qu'éviter de retélécharger le code.
      Seule cette page est installable : le formateur a l'application de bureau.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <!-- iOS ignore le manifeste pour l'écran d'accueil et lit ces deux balises. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Voxis" />
    <!-- Thème mémorisé appliqué avant le premier rendu (voir src/ui/theme.ts). -->
    <script>
      try {
        if (localStorage.getItem("voxis-theme") === "light") {
          document.documentElement.classList.replace("dark", "theme-light");
          document.querySelector('meta[name="theme-color"]').content = "#f9f9ff";
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-surface text-on-surface font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container flex flex-col min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/listener/main.tsx"></script>
  </body>
</html>
