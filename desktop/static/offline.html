<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>CEGA Voxis</title>
    <!--
      Écran affiché quand la salle ne répond pas. La coquille interroge le serveur en
      arrière-plan et recharge dès qu'il revient : ce bouton n'est qu'un raccourci pour qui
      ne veut pas attendre. L'adresse à rouvrir arrive dans le fragment de l'URL.
    -->
    <style>
      :root {
        color-scheme: dark;
        --fond: #0f131c;
        --texte: #e3e6ee;
        --discret: #9aa3b8; /* 7,3:1 sur le fond */
        --efface: #8b93a6; /* 6,0:1 — plus discret, mais toujours au-dessus du seuil AA */
        /* Jetons repris de client/tailwind.config.ts : texte sombre sur vert vif. */
        --accent: #4edea3;
        --accent-survol: #6ffbbe;
        --sur-accent: #003824;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: var(--fond);
        color: var(--texte);
        font: 15px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 32rem; text-align: center; }
      .marque {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        margin-bottom: 2rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .marque svg { width: 1.75rem; height: 1.75rem; }
      h1 { font-size: 1.3rem; margin: 0 0 0.6rem; }
      p { margin: 0 0 0.5rem; color: var(--discret); }
      code {
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 0.9em;
        color: var(--accent);
      }
      .etat {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin: 1.75rem 0;
        font-size: 0.875rem;
        color: var(--discret);
      }
      .pastille {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: #d9a441;
        animation: battement 1.4s ease-in-out infinite;
      }
      @keyframes battement {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pastille { animation: none; }
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 0.7rem 1.5rem;
        border: 0;
        border-radius: 0.75rem;
        background: var(--accent);
        color: var(--sur-accent);
        cursor: pointer;
      }
      button:hover { background: var(--accent-survol); }
      .aide {
        margin-top: 2.25rem;
        font-size: 0.8125rem;
        line-height: 1.8;
        color: var(--efface);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="marque">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#2563eb" />
          <rect x="6.5" y="12" width="3" height="8" rx="1.5" fill="#dbe1ff" />
          <rect x="12" y="8" width="3" height="16" rx="1.5" fill="#ffffff" />
          <rect x="17.5" y="5" width="3" height="22" rx="1.5" fill="#4edea3" />
          <rect x="23" y="11" width="3" height="10" rx="1.5" fill="#dbe1ff" />
        </svg>
        <span>CEGA Voxis</span>
      </div>

      <h1>La salle ne répond pas</h1>
      <p>Impossible de joindre <code id="adresse">le serveur</code>.</p>

      <div class="etat"><span class="pastille"></span> Nouvelle tentative automatique…</div>

      <div><button id="reessayer" type="button">Réessayer maintenant</button></div>

      <p class="aide">
        Vérifiez votre connexion à Internet.<br />
        Si elle fonctionne, le serveur de salle est peut-être arrêté ou en cours de mise à jour.
      </p>
    </main>

    <script>
      // La coquille passe l'adresse à rouvrir dans le fragment.
      const cible = decodeURIComponent(location.hash.slice(1));
      if (cible) {
        try {
          document.getElementById("adresse").textContent = new URL(cible).origin;
        } catch {
          /* fragment inattendu : on garde le texte par défaut */
        }
        document.getElementById("reessayer").addEventListener("click", () => {
          location.href = cible;
        });
      }
    </script>
  </body>
</html>
